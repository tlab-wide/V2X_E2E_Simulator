# Noise profiles, referred to by name from the object-info publishers.
# uniform: a value in [-amplitude, +amplitude] per axis (x_m, y_m, z_m, metres).
# gaussian: gaussian_mean + gaussian_std_dev × amplitude × N(0, 1) per axis.

noise_profiles:
- name: Default
  distribution: uniform
  x_m: 0.5
  y_m: 0.5
  z_m: 0.5
  gaussian_mean: 0
  gaussian_std_dev: 25
- name: Detection
  distribution: gaussian
  x_m: 0.1
  y_m: 0
  z_m: 0
  gaussian_mean: 0
  gaussian_std_dev: 0
- name: NoNoise
  distribution: gaussian
  x_m: 0
  y_m: 0
  z_m: 0
  gaussian_mean: 0
  gaussian_std_dev: 0
