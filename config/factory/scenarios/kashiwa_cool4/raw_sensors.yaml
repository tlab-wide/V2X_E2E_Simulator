# Raw sensors (RGL LiDARs publishing point clouds, cameras publishing images).
# mount: ego   = a sensor of an ego vehicle prefab, matched by vehicle + object (path below the vehicle; name[i] when names repeat)
#        scene = a sensor placed in the scene, matched by its scene path in object
#        world = a new sensor created from a raw_sensor_types entry (config/defaults/sensor_types.yaml) at pose
# enabled: false switches a sensor off. Raw sensors that are not listed stay as they are in the scene.
# lidar: hz, frame_id, point_cloud_topics (format: Pcl24, PointXYZIRCAEDT, ...). camera: image_topic, camera_info_topic,
# frame_id, width × height (a multiple of 4); hz is the rate of the camera holder (shared by its cameras).

raw_sensors:
- name: BusAutowareFinal/URDF/base_link/sensor_kit_base_link/velodyne_left_base_link/VelodyneVLP16
  kind: lidar
  mount: ego
  vehicle: BusAutowareFinal
  object: URDF/base_link/sensor_kit_base_link/velodyne_left_base_link/VelodyneVLP16
  type: ''
  enabled: true
  hz: 10
  frame_id: world
  point_cloud_topics:
  - topic: lidar_left/pointcloud
    format: Pcl24
    publish: true
  - topic: lidar_left/pointcloud_ex
    format: PointXYZIRCAEDT
    publish: true
