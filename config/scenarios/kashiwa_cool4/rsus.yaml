# RSUs, their pseudo sensors and the object-info publishers.
# pose: map frame (MGRS-local x/y/z, m), heading clockwise from north, pitch > 0 looks up (degrees).
# type: a name from config/defaults/sensor_types.yaml; h_fov_deg / v_fov_deg / range_m override it.
# object_info on a sensor: its own topics (no network copies). object_info_publishers: merged topics.

