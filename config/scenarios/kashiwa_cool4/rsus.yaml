object_info_publishers:
- name: all_rsus
  rsus: [all]
  topic: /v2x/object_info
  ground_truth_topic: /v2x/object_info_groundtruth
  hz: 10
  noise: {position: Default, rotation: Default, dimension: Default, probability: Default}
  network: [DSRC, Cellular]
per_sensor_object_info:
  hz: 10
  noise: {position: Default, rotation: Default, dimension: Default, probability: Default}
# Autoware PredictedObjects (autoware_auto_perception_msgs) of the objects seen by the sensors of the listed RSUs.
autoware_object_publishers:
- name: rsu1
  rsus: [Ganken]
  topic: /v2x/rsu1/predicted_object
  station_id: 1
  hz: 10
  noise: {position: Default, rotation: Default, dimension: Default, probability: Default}
  network: [DSRC, Cellular]
- name: rsu2
  rsus: [Kakeiken_A, Kakeiken_B]
  topic: /v2x/rsu2/predicted_object
  station_id: 2
  hz: 10
  noise: {position: NoNoise, rotation: NoNoise, dimension: NoNoise, probability: NoNoise}
  network: [DSRC, Cellular]
- name: rsu3
  rsus: [Midblock]
  topic: /v2x/rsu3/predicted_object
  station_id: 3
  hz: 10
  noise: {position: Default, rotation: Default, dimension: Default, probability: Default}
  network: [DSRC, Cellular]
- name: rsu4
  rsus: [Wakashiba]
  topic: /v2x/rsu4/predicted_object
  station_id: 4
  hz: 10
  noise: {position: Default, rotation: Default, dimension: Default, probability: Default}
  network: [DSRC, Cellular]
# V2X traffic signals (v2x_msgs/V2XSignals) of the vehicle traffic lights of the listed intersections.
# signal_id: relation = Lanelet2 regulatory-element IDs, way = traffic-light way IDs.
traffic_signal_publishers:
- name: rsu1
  station_id: 1
  intersections: [Ganken]
  topics: [/v2x/rsu1/traffic_signals, /v2x/traffic_signals]
  hz: 10
  signal_id: relation
- name: rsu2
  station_id: 2
  intersections: [Kakeiken]
  topics: [/v2x/rsu2/traffic_signals, /v2x/traffic_signals]
  hz: 10
  signal_id: relation
- name: rsu4
  station_id: 4
  intersections: [Wakashiba]
  topics: [/v2x/rsu4/traffic_signals, /v2x/traffic_signals]
  hz: 10
  signal_id: relation
- name: rsu5
  station_id: 5
  intersections: [Ekimae]
  topics: [/v2x/rsu5/traffic_signals]
  hz: 10
  signal_id: relation
