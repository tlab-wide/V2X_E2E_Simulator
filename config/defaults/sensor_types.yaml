# Pseudo-sensor (MockSensor) types: field of view (full angles, degrees) and range (m).
# kind: lidar | camera. RSU sensors in config/scenarios/*/rsus.yaml refer to a type by name and may override any value.
# Raw sensor types: prefabs that raw_sensors.yaml can create (mount: world).

pseudo_sensor_types:
- name: lidar_60x22deg_60m
  description: exported from RSU1_Ganken_CooL4/RSU_Lidar 1
  kind: lidar
  h_fov_deg: 60
  v_fov_deg: 22
  range_m: 60
- name: camera_84.8x45.3deg_75m
  description: exported from RSU2_Kakeiken_CooL4/RSU_camera 6
  kind: camera
  h_fov_deg: 84.8
  v_fov_deg: 45.3
  range_m: 75
- name: camera_84.8x45.3deg_50m
