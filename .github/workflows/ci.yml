name: ci
# Versioned documentation with mike:
#  - a version tag (v*) publishes that version and moves the "latest" alias to it
#  - a push to the develop branch publishes the in-development docs as "dev"
on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install "mkdocs<2" mkdocs-material mike
      - run: git fetch origin gh-pages --depth=1
      - name: Deploy release docs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mike deploy --push --update-aliases "${GITHUB_REF_NAME}" latest
          mike set-default --push latest
      - name: Deploy development docs
        if: github.ref == 'refs/heads/develop'
        run: mike deploy --push --title "dev (develop branch)" dev
