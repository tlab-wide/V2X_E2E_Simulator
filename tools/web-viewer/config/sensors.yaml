# RSU pseudo sensors (MockSensor) of the Kashiwa scene, shown by the web viewer (tools/web-viewer).
# Extracted from Assets/V2X/Scenes/V2X_E2E_Simulator_v3.1.1.unity; edit by hand if sensors are moved.
#
# position      WGS84 lat/lon; z_m = height in the map frame (MGRS local, metres)
# heading_deg   direction the sensor looks, clockwise from north; pitch_deg > 0 looks up
# h_fov_deg     half-angle as used by MockSensor (detects |yaw| <= h_fov_deg), so the covered sector
#               is 2 x h_fov_deg wide; v_fov_deg likewise; range_m = MockSensor.maxDistance
# enabled       whether the sensor is active in the scene
# rsu_ids, topics  the CooL4 DM object-info publishers (ObjectInfo) that publish this sensor's objects

